<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credentials – RoleMatch AI</title>
    <meta name="description"
        content="Set up your Gmail credentials and API keys for RoleMatch AI automation.">
    
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e17;
            --bg-card: rgba(17, 24, 39, 0.7);
            --bg-input: rgba(30, 41, 59, 0.6);
            --border-subtle: rgba(99, 102, 241, 0.2);
            --border-focus: rgba(99, 102, 241, 0.6);
            --accent-primary: #6366f1;
            --accent-secondary: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #34d399;
            --error: #f87171;
            --warning: #fbbf24;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 2rem 0;
        }

        /* ── Animated background ── */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }

        .bg-orb--1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.3), transparent 70%);
            top: -10%;
            right: -5%;
        }

        .bg-orb--2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.25), transparent 70%);
            bottom: -10%;
            left: -5%;
            animation-delay: -4s;
        }

        .bg-orb--3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -8s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -20px) scale(1.1);
            }

            100% {
                transform: translate(-20px, 30px) scale(0.95);
            }
        }

        /* ── Particles ── */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--accent-secondary);
            border-radius: 50%;
            opacity: 0;
            animation: particleFade 6s ease-in-out infinite;
        }

        @keyframes particleFade {
            0% {
                opacity: 0;
                transform: translateY(0);
            }

            30% {
                opacity: 0.5;
            }

            100% {
                opacity: 0;
                transform: translateY(-120px);
            }
        }

        /* ── Main wrapper ── */
        .upload-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 720px;
            padding: 1.5rem;
            animation: fadeSlideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Glass card ── */
        .upload-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 2.5rem 2.2rem 2rem;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03),
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 0 40px var(--accent-glow);
            transition: box-shadow 0.4s ease;
        }

        /* ── Header / Brand ── */
        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-header .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            font-size: 1.8rem;
            margin-bottom: 1rem;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {

            0%,
            100% {
                box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
            }

            50% {
                box-shadow: 0 8px 40px rgba(245, 158, 11, 0.5);
            }
        }

        .page-header h1 {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text-primary) 30%, var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.25;
        }

        .page-header p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
        }

        /* ── Navigation bar ── */
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.8rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-bar .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-bar .back-link:hover {
            color: var(--text-primary);
        }

        .nav-bar .step-indicator {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            opacity: 0.3;
            transition: all 0.3s;
        }

        .step-dot.done {
            background: var(--success);
            opacity: 1;
        }

        .step-dot.active {
            background: var(--accent-primary);
            opacity: 1;
            width: 24px;
            border-radius: 10px;
        }

        /* ── Settings Field ── */
        .settings-field {
            margin-bottom: 1rem;
        }

        .settings-field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.35rem;
        }

        .settings-field input,
        .settings-field textarea {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.88rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }

        .settings-field input:focus,
        .settings-field textarea:focus {
            border-color: var(--border-focus);
        }

        .settings-field textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.5;
        }

        /* ── Divider ── */
        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-subtle), transparent);
            margin: 1.8rem 0;
        }

        /* ── Continue button ── */
        .continue-btn {
            width: 100%;
            padding: 0.9rem;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--accent-primary), #7c3aed);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px var(--accent-glow);
            letter-spacing: 0.3px;
            margin-top: 1.5rem;
        }

        .continue-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 28px rgba(99, 102, 241, 0.45);
        }

        .continue-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .continue-btn .btn-text {
            position: relative;
            z-index: 1;
        }
        
        .skip-container {
            text-align: center;
            margin-top: 1rem;
        }

        .skip-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }

        .skip-btn:hover {
            color: var(--text-primary);
        }

        /* ── Responsive ── */
        @media (max-width: 520px) {
            .upload-wrapper {
                padding: 1rem;
            }

            .upload-card {
                padding: 2rem 1.3rem 1.5rem;
                border-radius: 16px;
            }

            .page-header h1 {
                font-size: 1.35rem;
            }
            
            .nav-bar {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }
    
        
        
        
        
        /* --- Reversed Blue/Black/White Theme Overrides --- */
        :root {
            --bg-primary: #0a66c2 !important; /* Deep Blue Background */
            --bg-card: #ffffff !important; /* White Cards */
            --bg-input: #ffffff !important;
            --bg-row: #ffffff !important;
            --bg-row-hover: #f1f5f9 !important;
            
            --border-subtle: #000000 !important; /* Black Borders */
            --border-focus: #000000 !important;
            
            --accent-primary: #000000 !important; /* Black accents / buttons */
            --accent-secondary: #333333 !important;
            --accent-glow: transparent !important;
            
            --text-primary: #000000 !important; /* Black Text inside cards */
            --text-secondary: #000000 !important;
            --text-muted: #333333 !important;
        }

        body {
            background-color: var(--bg-primary) !important;
            color: #ffffff !important; /* Default to white text on blue background */
        }

        /* Hide the dark mode space theme background elements */
        .bg-grid, .bg-orb, .particles {
            display: none !important;
        }

        /* Ensure outer text is white on the blue background */
        .hero-title, .hero-subtitle, .section-title, .dash-header h1, .nav-brand, .ext-description, .footer-content p, .footer-content h3 {
            color: #ffffff !important;
            background: none !important;
            -webkit-text-fill-color: #ffffff !important;
            text-shadow: none !important;
        }

        /* Navbar & Footer */
        .navbar, .app-footer {
            background-color: #000000 !important; /* Black header/footer looks sharp */
            border: none !important;
            color: #ffffff !important;
        }
        
        .navbar .nav-brand, .navbar .nav-brand span {
            color: #ffffff !important;
            background: transparent !important;
        }

        /* Cards and containers - White with Black text */
        .stat-box, .screenshot-card, .extension-card, .step-card, .card, .auth-card, .stat-card {
            background-color: var(--bg-card) !important;
            border: 2px solid #000000 !important;
            border-radius: 8px !important;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5) !important; /* Sharp solid shadow */
            color: #000000 !important;
        }
        
        /* Dashboard wrapper */
        .dashboard {
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .stat-box:hover, .screenshot-card:hover, .extension-card:hover, .step-card:hover {
            transform: translate(-2px, -2px) !important;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.5) !important;
            border-color: #000000 !important;
        }

        /* Forces all text inside cards to be black */
        .stat-box *, .screenshot-card *, .extension-card *, .step-card *, .card *, .auth-card *, .stat-card * {
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
        }

        /* Exception: Buttons inside cards should be black with white text */
        .cta-btn, .btn-primary, button.primary, .send-btn, .ext-download-btn, .login-btn-top {
            background-color: #000000 !important;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            border: 2px solid #000000 !important;
            border-radius: 6px !important;
            font-weight: bold !important;
        }
        
        .cta-btn *, .btn-primary *, button.primary *, .send-btn *, .ext-download-btn *, .login-btn-top * {
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
        }
        
        .cta-btn:hover, .btn-primary:hover, button.primary:hover, .send-btn:hover, .ext-download-btn:hover, .login-btn-top:hover {
            background-color: #ffffff !important;
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
        }
        
        .cta-btn:hover *, .btn-primary:hover *, button.primary:hover *, .send-btn:hover *, .ext-download-btn:hover *, .login-btn-top:hover * {
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
        }

        /* Inputs & Forms */
        input, textarea, select {
            background-color: #ffffff !important;
            border: 2px solid #000000 !important;
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
            border-radius: 4px !important;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #000000 !important;
            box-shadow: 2px 2px 0px #000000 !important;
            outline: none !important;
        }

        /* Tables */
        table, th, td {
            border: 1px solid #000000 !important;
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
            background-color: #ffffff !important;
        }
        
        th {
            background-color: #f1f5f9 !important;
            font-weight: bold !important;
        }
        
        tr:hover td {
            background-color: #f1f5f9 !important;
        }

        /* Code blocks / instructions */
        .ext-instructions, .step-list code, .ext-instructions code, .code-block {
            background: #f1f5f9 !important;
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
            border: 1px solid #000000 !important;
        }
        
        /* Number icons and badges */
        .step-number, .brand-icon {
            background: #000000 !important;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            border: 2px solid #ffffff !important;
        }

    
        /* --- Fix for Footer Hover Effects --- */
        .app-footer .social-bar-link, .app-footer .btn-secondary {
            border: 2px solid #ffffff !important;
        }
        
        .app-footer .social-bar-link:hover, .app-footer .btn-secondary:hover {
            background-color: #333333 !important; /* Dark gray instead of pitch black so it's visible on black footer */
            color: #ffffff !important;
            border-color: #ffffff !important;
        }
        
        .social-bar-link:hover, .btn-secondary:hover {
            /* General fix if they are outside the footer */
            border-color: #000000 !important; 
        }
        
        /* Make sure SVG icons inside the links also invert correctly */
        .social-bar-link:hover svg, .btn-secondary:hover svg {
            color: inherit !important;
            fill: currentColor !important;
        }

    
        /* --- Social Links Blue/White/Black Theme --- */
        .social-bar-link, .app-footer .social-bar-link {
            background-color: #0a66c2 !important; /* LinkedIn Blue */
            color: #ffffff !important; /* White text */
            border: 2px solid #0a66c2 !important; /* Blue border to match */
        }
        
        /* Ensure SVGs inside the link inherit the white color */
        .social-bar-link *, .app-footer .social-bar-link * {
            color: #ffffff !important;
            fill: #ffffff !important;
        }
        
        .social-bar-link:hover, .app-footer .social-bar-link:hover {
            background-color: #ffffff !important; /* Turns white on hover */
            color: #000000 !important; /* Text turns black */
            border-color: #ffffff !important; /* Border turns white */
        }
        
        /* Ensure SVGs inside the link inherit the black color on hover */
        .social-bar-link:hover *, .app-footer .social-bar-link:hover * {
            color: #000000 !important;
            fill: #000000 !important;
        }

    </style>

    
</head>

<body>

    <!-- Background effects -->
    <div class="bg-grid"></div>
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
    <div class="particles" id="particles"></div>

    <!-- Upload page -->
    <div class="upload-wrapper">
        <div class="upload-card">

            <!-- Header -->
            <div class="page-header">
                <div class="brand-icon">🔑</div>
                <h1>Setup Credentials</h1>
                <p>Provide the keys needed for AI analysis and email dispatch</p>
            </div>

            <!-- Nav bar with steps -->
            <nav class="nav-bar">
                <a href="#" class="back-link" id="logoutBtn" style="color: var(--error);">← Logout</a>
                <div class="step-indicator">
                    <div class="step-dot done" title="Login"></div>
                    <div class="step-dot active" title="Setup Credentials"></div>
                    <div class="step-dot" title="Upload Files"></div>
                    <div class="step-dot" title="Review & Send"></div>
                </div>
            </nav>

            <!-- ═══ SECTION 1: Gmail Credentials ═══ -->
            <div class="settings-field">
                <label for="senderEmail">Sender Gmail</label>
                <input type="email" id="senderEmail" placeholder="yourname@gmail.com">
            </div>
            <div class="settings-field">
                <label for="senderAppPassword">App Password</label>
                <input type="password" id="senderAppPassword" placeholder="16-character app password">
            </div>

            <!-- ═══ SECTION 2: API Key ═══ -->
            <div class="section-divider"></div>
            
            <div class="settings-field">
                <label for="geminiApiKeyInput">Gemini API Key</label>
                <input type="password" id="geminiApiKeyInput" placeholder="AIzaSy...">
                <p style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.5rem; line-height: 1.4;">This key is exclusively used to power the AI job analysis.</p>
            </div>

            <!-- ═══ SECTION 3: Mail Template ═══ -->
            <div class="section-divider"></div>

            <div class="settings-field">
                <label for="sampleEmailTemplate">Sample Email Template</label>
                <textarea id="sampleEmailTemplate" placeholder="Paste a sample email here. AI will use its tone and structure when drafting application emails for each job."></textarea>
            </div>

            <button class="continue-btn" id="saveContinueBtn">
                <span class="btn-text">💾 Save & Continue</span>
            </button>
            
            <div class="skip-container">
                <button class="skip-btn" id="skipBtn">Skip (I already saved these)</button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_init.js"></script>
    <script src="credentials.js"></script>
</body>

</html>
